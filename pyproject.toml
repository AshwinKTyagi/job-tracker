[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobtrack"
version = "0.1.0"
description = "Track job applications by scanning Gmail once a day."
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "plotly>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dateutil>=2.8",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "pandas-stubs",
    "types-python-dateutil",
]

[project.scripts]
jobtrack = "jobtrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobtrack = ["store/schema.sql", "store/migrations/*.sql"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["A003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "plotly.*", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# --disable-socket enforces CLAUDE.md's "no network in tests, ever". A test that reaches
# for the Gmail API or an Ollama host fails loudly instead of silently depending on the
# network. Unix sockets stay open because some local tooling needs them.
addopts = "-q --strict-markers --disable-socket --allow-unix-socket"
filterwarnings = ["error::DeprecationWarning:jobtrack.*"]
